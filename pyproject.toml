[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universa-reports"
version = "1.1.0"
authors = [{ name = "PEREIRA ARISTIDE BIMAM KPESS" }]
description = "Générateur de rapports académiques professionnels en PDF"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich",
    "jinja2",
    "weasyprint"
]

[project.scripts]
universa-reports = "universa_reports.cli:main"

[tool.setuptools.package-dir]
universa_reports = "python-src"

[tool.setuptools.package-data]
universa_reports = ["templates/**/*", "assets/*"]